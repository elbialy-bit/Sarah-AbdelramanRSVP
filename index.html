      background-position: center;

    .card {
      background: #ffffff;
      border: 3px solid #9b5a5a;
      border-radius: 16px;
      padding: 2rem 1.75rem 2rem;
      width: calc(100% - 48px);
      max-width: 520px;
      margin: 80px 24px;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 1.75rem;
      line-height: 1.1;
    }

    .field-label {
      font-size: 15px;
      color: #2a2a2a;
      font-weight: 300;
      margin-bottom: 10px;
      display: block;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #c8c8c8;
      border-radius: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 16px;
      font-weight: 300;
      color: #1a1a1a;
      background: #fff;
      outline: none;
      margin-bottom: 1.5rem;
    }

    input[type="text"]:focus {
      border-color: #9b5a5a;
    }

    .attend-label {
      font-size: 15px;
      color: #2a2a2a;
      font-weight: 300;
      margin-bottom: 12px;
      display: block;
    }

    .attend-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .attend-btn {
      background: #e8e8e8;
      border: none;
      border-radius: 10px;
      padding: 22px 18px;
      text-align: left;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 400;
      color: #2a2a2a;
      transition: background 0.2s, outline 0.15s;
      outline: 2px solid transparent;
    }

    .attend-btn:hover {
      background: #ddd;
    }

    .attend-btn.selected {
      background: #d6e2c4;
      outline: 2px solid #7a9a5a;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: #7a9a5a;
      border: none;
      border-radius: 50px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      color: #2a2a2a;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .submit-btn:hover { background: #6a8a4a; }
    .submit-btn:active { transform: scale(0.99); }

    .error-msg {
      color: #9b3a3a;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 12px;
      display: none;
    }

    .success-state {
      text-align: center;
      padding: 1.5rem 0;
      display: none;
    }

    .success-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }

    .success-msg {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card" id="form-section">
    <h1 class="card-title">Kindly RSVP</h1>

    <label class="field-label" for="guest-name">What is your full name?</label>
    <input type="text" id="guest-name" autocomplete="name" />

    <span class="attend-label">Are you coming?</span>
    <div class="attend-options">
      <button class="attend-btn" id="btn-yes" onclick="selectAttend('yes')" aria-pressed="false">
        Absolutely, wouldn't miss it!
      </button>
      <button class="attend-btn" id="btn-no" onclick="selectAttend('no')" aria-pressed="false">
        Unfortunately, I can't make it.
      </button>
    </div>

    <p class="error-msg" id="error-msg" role="alert">Please enter your name and select an option.</p>

    <button class="submit-btn" onclick="submitRSVP()">Submit!</button>
  </div>

  <div class="card success-state" id="success-section" aria-live="polite">
    <p class="success-title" id="success-title">Thank you!</p>
    <p class="success-msg" id="success-msg">Your RSVP has been received.</p>
  </div>

  <script>
    let attendChoice = null;

    function selectAttend(val) {
      attendChoice = val;
      document.getElementById('btn-yes').className = 'attend-btn' + (val === 'yes' ? ' selected' : '');
      document.getElementById('btn-no').className  = 'attend-btn' + (val === 'no'  ? ' selected' : '');
      document.getElementById('btn-yes').setAttribute('aria-pressed', val === 'yes');
      document.getElementById('btn-no').setAttribute('aria-pressed',  val === 'no');
    }

    async function submitRSVP() {
      const name = document.getElementById('guest-name').value.trim();
      const err  = document.getElementById('error-msg');
      const btn  = document.querySelector('.submit-btn');

      if (!name || !attendChoice) {
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      btn.textContent = 'Sending…';
      btn.disabled = true;

      try {
        const res = await fetch('https://formspree.io/f/mykawpjj', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, attending: attendChoice === 'yes' ? 'Yes' : 'No' })
        });
        if (!res.ok) throw new Error('Network error');

        document.getElementById('form-section').style.display = 'none';
        const s = document.getElementById('success-section');
        s.style.display = 'flex';
        s.style.flexDirection = 'column';
        s.style.alignItems = 'center';

        if (attendChoice === 'yes') {
          document.getElementById('success-title').textContent = 'We cannot wait to see you, ' + name + '!';
          document.getElementById('success-msg').textContent   = 'Your RSVP has been received. See you at the celebration!';
        } else {
          document.getElementById('success-title').textContent = 'Thank you for letting us know, ' + name + '.';
          document.getElementById('success-msg').textContent   = 'You will be missed. Wishing you all the best!';
        }
      } catch (e) {
        btn.textContent = 'Submit!';
        btn.disabled = false;
        err.textContent = 'Something went wrong. Please try again.';
        err.style.display = 'block';
      }
    }
  </script>
</body>
</html>
